name: Publish Python IaC

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to check or publish, for example cdk-python-v0.1.1'
        type: string
        required: true
      dry_run:
        description: 'Build and check only; do not publish'
        type: boolean
        default: true
      publish:
        description: 'Type "publish" to confirm a real release (also requires dry_run off)'
        type: string
        default: ''

permissions:
  contents: read

env:
  CI_WORKFLOWS_REF: main

# One run per tag. A fixed group would keep only the newest pending run and cancel the ones in between.
concurrency:
  group: publish-cdk-python-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  verify:
    if: >-
      github.event_name == 'workflow_dispatch'
      || startsWith(github.event.release.tag_name, 'cdk-python-v')
    name: Verify and build
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    defaults:
      run:
        working-directory: iac/codemie-iac-python
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Require the tag on the released commit
        id: tagcommit
        if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.dry_run == false && inputs.publish == 'publish')
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          TAGGED=$(git rev-parse -q --verify "refs/tags/$RELEASE_TAG^{commit}") || {
            echo "Tag $RELEASE_TAG does not exist"; exit 1
          }
          if [ "$TAGGED" != "$GITHUB_SHA" ]; then
            echo "Tag $RELEASE_TAG points to $TAGGED, not to the run commit $GITHUB_SHA"; exit 1
          fi
          echo "tagged=$TAGGED" >> "$GITHUB_OUTPUT"

      - name: Require the tagged commit on main
        if: github.event_name == 'release'
        env:
          TAGGED: ${{ steps.tagcommit.outputs.tagged }}
        run: |
          if ! git merge-base --is-ancestor "$TAGGED" origin/main; then
            echo "The tagged commit $TAGGED is not on main"; exit 1
          fi

      - name: Require main for a real publish
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run == false && inputs.publish == 'publish'
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "A real publish must run from main, not $GITHUB_REF"; exit 1
          fi

      - name: Download version check script
        run: |
          mkdir -p "$RUNNER_TEMP/scripts/release"
          curl -fsSL "https://raw.githubusercontent.com/codemie-ai/ci-workflows/${{ env.CI_WORKFLOWS_REF }}/scripts/release/check_version.py" -o "$RUNNER_TEMP/scripts/release/check_version.py"

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Install Poetry
        run: pipx install poetry

      # The tag names the version. The manifest holds only the base line (MAJOR.MINOR) and the tag must be on it.
      - name: Read the version from the tag
        id: version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          BASE=$(poetry version --short)
          VERSION=$(python3 "$RUNNER_TEMP/scripts/release/check_version.py" --ecosystem pypi --name codemie-cdk-python --tag "$RELEASE_TAG" --base "$BASE" --tag-prefix cdk-python-v)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Releasing codemie-cdk-python $VERSION" >> "$GITHUB_STEP_SUMMARY"

      - name: Stamp the version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: poetry version "$VERSION"

      - name: Install dependencies
        run: poetry install --no-interaction

      - name: Lint
        run: poetry run ruff check .

      - name: Format check
        run: poetry run ruff format --check .

      - name: Unit tests
        run: poetry run pytest tests/

      - name: Check version against PyPI
        env:
          PACKAGE: codemie-cdk-python
          VERSION: ${{ steps.version.outputs.version }}
        run: python3 "$RUNNER_TEMP/scripts/release/check_version.py" --ecosystem pypi --name codemie-cdk-python --version "$VERSION"

      - name: Build package
        run: poetry build

      - name: Upload distributions
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-dist
          path: iac/codemie-iac-python/dist/
          if-no-files-found: error

  # OIDC trusted publishing, no stored API token: https://docs.pypi.org/trusted-publishers/
  publish:
    name: Publish to PyPI
    needs: verify
    if: >-
      github.repository == 'codemie-ai/codemie-cdk'
      && (github.event_name == 'release' || (github.event_name == 'workflow_dispatch'
      && inputs.dry_run == false && inputs.publish == 'publish'
      && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
