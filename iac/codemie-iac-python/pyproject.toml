[tool.poetry]
name = "codemie-iac-python"
version = "0.1.0"
description = "CodeMie IaC document envelope (Python)"
authors = ["EPAM Systems"]
readme = "README.md"
packages = [{ include = "codemie_iac", from = "src" }]

[tool.poetry.dependencies]
python = "^3.12"
codemie-sdk-python = "0.1.686"
pydantic = "^2.12.2"
pyyaml = "^6.0.2"
jsonschema = "^4.23.0"

[tool.poetry.group.dev.dependencies]
ruff = "^0.11.3"
pytest-cov = "^6.0.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
