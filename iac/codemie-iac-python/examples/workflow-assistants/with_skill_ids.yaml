# Inline workflow assistant with a skill: `skill_ids` takes a skill name (a
# skill document in the bundle, or a skill in the target project) or a
# platform skill id.
---
version: v1
meta:
  kind: workflow
  name: wf-assistant-skill
spec:
  workflow:
    name: wf-assistant-skill
    description: Inline assistant with a skill
    mode: Sequential
    assistants:
      writer:
        system_prompt: Write the changelog entry.
        model: gpt-4o
        skill_ids:
          - 00000000-0000-0000-0000-000000000002
    states:
      - id: write
        assistant_id: writer
        task: Write the changelog entry
        next: {}
