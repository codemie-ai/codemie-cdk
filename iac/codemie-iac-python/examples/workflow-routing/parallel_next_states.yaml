# Routing: `state_ids` fans out to several states that run in parallel.
---
version: v1
meta:
  kind: workflow
  name: routing-parallel
spec:
  workflow:
    name: routing-parallel
    description: Fan out to two states
    mode: Sequential
    assistants:
      worker:
        system_prompt: Do the task you are given.
    states:
      - id: start
        assistant_id: worker
        task: Split the work
        next:
          state_ids: [left, right]
      - id: left
        assistant_id: worker
        task: Handle the left half
        next: {}
      - id: right
        assistant_id: worker
        task: Handle the right half
        next: {}
